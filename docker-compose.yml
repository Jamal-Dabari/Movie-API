services: 
  frontend:
    build: ./frontend/.
    ports: 
    - "5173:5173"


  backend:
    build: ./backend/.
    ports: 
      - "8080:8080"
    depends_on: 
      - db


  db:
    image: mongo:latest
    ports: 
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user 
      - MONGO_INITDB_ROOT_PASSWORD=password 
      - MONGO_INITDB_DATABASE=moviesdb
    volumes:
      - db_data:/data/db


volumes: 
  db_data:


